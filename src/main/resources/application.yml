server:
  port: 8080

spring:
  application:
    name: spring-lab-01
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/springlab}
    username: ${DB_USERNAME:springlab}
    password: ${DB_PASSWORD:springlab}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.format_sql: true
      hibernate.query.fail_on_pagination_over_collection_fetch: true
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

app:
  owner: Aruzhan Zhaksybekova
  group: IT1-2404IS
  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: PT5S
    enabled: true
  security:
    token-ttl: 30m
    min-password-length: 12

logging:
  level:
    kz.iitu: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions
